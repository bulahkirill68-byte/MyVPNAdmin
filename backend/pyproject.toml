[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reality-control"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.4", "uvicorn==0.54.0", "sqlalchemy==2.1.8",
  "alembic==1.20.1", "pydantic==2.14.3", "argon2-cffi==25.1.0",
  "grpcio==1.85.1", "protobuf==7.36.2", "psutil==7.2.2", "filelock==3.32.7"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "grpcio-tools>=1.70,<2", "cryptography>=44,<49"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
