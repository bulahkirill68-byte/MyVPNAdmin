plugins { id 'com.android.application' }
def signing = new Properties()
def signingFile = rootProject.file('signing.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }
android {
    namespace 'com.realitycontrol.vpn'
    compileSdk 35
    defaultConfig {
        applicationId 'com.realitycontrol.vpn'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.0.3'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    testOptions { unitTests.includeAndroidResources = true }
    signingConfigs {
        if (signingFile.exists()) localRelease {
            storeFile rootProject.file(signing.getProperty('storeFile'))
            storePassword signing.getProperty('storePassword')
            keyAlias signing.getProperty('keyAlias')
            keyPassword signing.getProperty('keyPassword')
        }
    }
    buildTypes { release { minifyEnabled false; if (signingFile.exists()) signingConfig signingConfigs.localRelease } }
    packaging { jniLibs { useLegacyPackaging = false } }
}
dependencies {
    implementation files('libs/libv2ray.aar')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250107'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
