name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e './backend[test]'
      - run: ruff check backend scripts host public
      - run: bash -n host/install_xray_reality.sh scripts/install_agent.sh scripts/install.sh scripts/update.sh scripts/enable_https.sh
      - run: pytest -q
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build && npm audit --omit=dev
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npx playwright test --reporter=list
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-screenshots
          path: artifacts/*.png
      - name: Production image and unprivileged runtime smoke
        run: |
          cp .env.example .env
          mkdir data
          sudo chown 10001:10001 data
          chmod -R go-rwx backend/alembic backend/alembic.ini
          docker compose config --quiet
          docker compose build
          docker compose up -d --wait
          docker compose exec -T web python -c "import os,urllib.request; assert os.getuid()==10001; print(urllib.request.urlopen('http://127.0.0.1:8000/health').read())"
          docker compose stop
