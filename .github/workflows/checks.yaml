name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e './backend[test]'
      - run: ruff check backend scripts
      - run: pytest -q
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build && npm audit --omit=dev
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npx playwright test --reporter=list
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-screenshots
          path: artifacts/*.png
      - run: cp .env.example .env && mkdir data && docker compose config --quiet && docker compose build
